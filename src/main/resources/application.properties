spring.application.name=mask
server.port=8082

# Authentication is done entirely by JwtAuthenticationFilter from the request's
# bearer token; the default in-memory user Spring Security would otherwise
# generate is unused here.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# HMAC-SHA256 signing key for request-payload JWTs (base64, >= 256 bits).
# This default is for local development only - override with the JWT_SECRET
# env var (or a vault-backed property source) in every other environment.
jwt.secret=${JWT_SECRET:Gy5yK/3cjXD529NdyhP+v1VK8N92JItc/YqAxLFFk5c=}
jwt.expiration-minutes=15
